# nginx для базы знаний. Скопируйте в /etc/nginx/sites-available/kb,
# замените kb.example.com и /var/www/kb на свои, затем:
#   ln -s /etc/nginx/sites-available/kb /etc/nginx/sites-enabled/kb
#   nginx -t && systemctl reload nginx
# Сертификат: certbot --nginx -d kb.example.com (certbot сам допишет ssl_certificate).

server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kb.example.com;

    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;

    root /var/www/kb;
    index index.html;
    charset utf-8;

    # Сайт закрыт: каждую страницу и файл пускаем только после входа через GitHub
    # (kb-api проверяет cookie сессии, сессия живёт год и продлевается сама).
    # Чтобы открыть сайт всем, закомментируйте две строки ниже.
    auth_request /_kb_auth;
    error_page 401 = @kb_login;

    location = /_kb_auth {
        internal;
        proxy_pass http://127.0.0.1:8787/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location @kb_login {
        add_header Cache-Control "no-store" always;
        return 302 /api/auth/login?next=$request_uri;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml;

    # Редактор: бэкенд kb-api (см. server/README.md). Без него сайт работает только на чтение.
    location /api/ {
        auth_request off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15m;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # SVG из заметок открываются и напрямую — запрещаем в них скрипты
    location ~* \.svg$ {
        add_header Content-Security-Policy "script-src 'none'; object-src 'none'" always;
        add_header Cache-Control "no-cache";
    }

    # Quartz отдаёт страницы без .html: /сети/tls-рукопожатие → tls-рукопожатие.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;

    # Service worker и манифест всегда свежие, иначе обновления приходят с задержкой
    # Открыто без входа: service worker, манифест и иконки (их браузер берёт без cookie)
    location = /sw.js {
        auth_request off;
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        auth_request off;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Стили и скрипты с хешем в имени не меняются — кешируем надолго
    location ~* "-[0-9a-f]{8}\.(css|js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /static/pwa/ {
        auth_request off;
    }
    location = /static/icon.png {
        auth_request off;
    }
    location /static/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
