# nginx для базы знаний. Скопируйте в /etc/nginx/sites-available/kb,
# замените kb.example.com и /var/www/kb на свои, затем:
#   ln -s /etc/nginx/sites-available/kb /etc/nginx/sites-enabled/kb
#   nginx -t && systemctl reload nginx
# Сертификат: certbot --nginx -d kb.example.com (certbot сам допишет ssl_certificate).

server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kb.example.com;

    ssl_certificate     /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;

    root /var/www/kb;
    index index.html;
    charset utf-8;

    # Закрыть сайт паролем (раскомментируйте и создайте файл:
    #   htpasswd -c /etc/nginx/.htpasswd-kb ваш_логин
    # auth_basic "kb";
    # auth_basic_user_file /etc/nginx/.htpasswd-kb;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/xml;

    # Quartz отдаёт страницы без .html: /сети/tls-рукопожатие → tls-рукопожатие.html
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;

    # Service worker и манифест всегда свежие, иначе обновления приходят с задержкой
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Стили и скрипты с хешем в имени не меняются — кешируем надолго
    location ~* -[0-9a-f]{8}\.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /static/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
